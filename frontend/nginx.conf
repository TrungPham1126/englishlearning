server {
    listen 80;
    server_name localhost;

    client_max_body_size 500M;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Nén Gzip tối ưu hoá cho mã nguồn, font chữ và hình ảnh vector
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml
        font/woff2;

    # 1. Tránh cache file index.html để người dùng luôn nhận phiên bản ứng dụng mới nhất
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # 2. Cache cực đại 1 năm đối với các file tĩnh Vite có gắn hash nội dung (immutable)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 3. Phục vụ trực tiếp Audio & Media uploads từ ổ đĩa (Shared Volume)
    # Nginx stream trực tiếp file nhị phân bằng sendfile ở tầng kernel, giải phóng tải cho Spring Boot
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
        try_files $uri @proxy_to_backend;
    }

    # Fallback chuyển tiếp về Backend nếu file chưa có cục bộ
    location @proxy_to_backend {
        proxy_pass http://backend:8080/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. React Single Page Application (SPA) Router
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 5. Reverse proxy cho Backend REST APIs
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 6. Swagger / OpenAPI documentation
    location /swagger-ui/ {
        proxy_pass http://backend:8080/swagger-ui/;
        proxy_set_header Host $host;
    }

    location /v3/api-docs/ {
        proxy_pass http://backend:8080/v3/api-docs/;
        proxy_set_header Host $host;
    }
}
