services:
  # ============================================================================
  # 1. DATABASE: MySQL 8.0
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: englishlearning-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-englishlearning_db}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      # Port 3307 trên máy host để KHÔNG xung đột với MySQL 3306 chạy local
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-network

  # ============================================================================
  # 2. AI PHONETICS SERVICE: FastAPI + Wav2Vec2 + Kokoro TTS
  # ============================================================================
  phonetics-service:
    build:
      context: ./phonetics-service
      dockerfile: Dockerfile
    container_name: englishlearning-phonetics
    restart: unless-stopped
    ports:
      - "${PHONETICS_PORT:-8000}:8000"
    environment:
      - MODEL_NAME=facebook/wav2vec2-xlsr-53-espeak-cv-ft
      - MODEL_DEVICE=cpu
      - MODEL_CACHE_DIR=/app/cache/huggingface
      - SAMPLE_RATE=16000
    volumes:
      # Tái sử dụng trực tiếp cache model AI có sẵn từ thư mục máy host
      - ./phonetics-service/cache:/app/cache
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - app-network

  # ============================================================================
  # 3. BACKEND CORE: Java Spring Boot 3
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: englishlearning-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      phonetics-service:
        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-englishlearning_db}?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - PYTHON_AUDIO_SERVICE_URL=http://phonetics-service:8000/api/v1/audio/evaluate-phonetics
      - KOKORO_TTS_URL=http://phonetics-service:8000/tts
      - STORAGE_PUBLIC_URL=http://localhost:8080/uploads
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - app-network

  # ============================================================================
  # 4. FRONTEND WEB: React + Vite (Nginx Reverse Proxy)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: englishlearning-frontend
    restart: unless-stopped
    ports:
      # Mặc định mở port 3000 khi chạy Docker để không xung đột với port 5173 của npm run dev local
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    name: englishlearning-network
    driver: bridge

volumes:
  mysql_data:
    name: englishlearning_mysql_data
  backend_uploads:
    name: englishlearning_backend_uploads
