# ===================================================================
# APPLICATION SERVER CONFIGURATION
# ===================================================================
server.port=8080
server.servlet.context-path=/
spring.application.name=english-learning-platform

# ===================================================================
# MYSQL DATABASE CONFIGURATION
# ===================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:english_learning_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${app.secrets.database.username}
spring.datasource.password=${app.secrets.database.password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# JPA & HIBERNATE (TỰ ĐỘNG SINH BẢNG CHO MYSQL)
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# FLYWAY (TẮT ĐỂ HIBERNATE TỰ SINH BẢNG)
# ===================================================================
spring.flyway.enabled=false

# ===================================================================
# REDIS & RABBITMQ
# ===================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${app.secrets.redis.password}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${app.secrets.rabbitmq.username}
spring.rabbitmq.password=${app.secrets.rabbitmq.password}

# ===================================================================
# MULTIPART UPLOAD
# ===================================================================
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# ===================================================================
# SWAGGER / OPENAPI 3 UI
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method