# ===================================================================
# APPLICATION SERVER CONFIGURATION
# ===================================================================
server.port=8080
server.servlet.context-path=/
spring.application.name=english-learning-platform

# ===================================================================
# MYSQL DATABASE CONFIGURATION
# ===================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:english_learning_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# JPA & HIBERNATE (T? ??NG SINH B?NG CHO MYSQL)
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# FLYWAY
# ===================================================================
spring.flyway.enabled=false

# ===================================================================
# REDIS & RABBITMQ (CH?Y LOCAL DOCKER)
# ===================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# C?u hình retry cho RabbitMQ Listener
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2000ms
spring.rabbitmq.listener.simple.retry.multiplier=1.5
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ===================================================================
# MULTIPART UPLOAD
# ===================================================================
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# ===================================================================
# SWAGGER / OPENAPI 3 UI
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ===================================================================
# CLOUDFLARE R2 / AWS S3 CONFIGURATION (FALLBACK DUMMY KHI CH?Y LOCAL)
# ===================================================================
cloud.aws.credentials.access-key=${STORAGE_ACCESS_KEY:dummy_access_key}
cloud.aws.credentials.secret-key=${STORAGE_SECRET_KEY:dummy_secret_key}
cloud.aws.region.static=${STORAGE_REGION:auto}
cloud.aws.s3.bucket=${STORAGE_BUCKET:dummy_bucket}
cloud.aws.s3.endpoint=${STORAGE_ENDPOINT:https://dummy.r2.cloudflarestorage.com}
cloud.aws.s3.public-url=${STORAGE_PUBLIC_URL:http://localhost:8080/files}